[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-boot"
version = "0.0.0"
description = "Azazel-Boot Responder (AZ-03) -- existing-environment user assistance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The current scope is a non-operational status and design scaffold. A concrete
# host-side installer has not been specified or implemented.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
azazel-boot = "azazel_boot.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["azazel_boot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
