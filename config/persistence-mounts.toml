destination = "/var/lib/azazel/evidence"
mode = "0700"
required = false

[[mount]]
name = "logs"
source = "logs"
destination = "/var/lib/azazel/logs"
mode = "0700"
required = false

[[mount]]
name = "knowledge"
source = "knowledge"
destination = "/var/lib/azazel/knowledge"
mode = "0700"
required = false

[[mount]]
name = "snapshots"
source = "snapshots"
destination = "/var/lib/azazel/snapshots"
mode = "0700"
required = false

[[mount]]
name = "operator"
source = "operator"
destination = "/var/lib/azazel/operator"
mode = "0700"
required = false
